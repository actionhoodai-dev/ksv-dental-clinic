<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSV Dental Clinic | Dr. L. Suresh | 30 Years Excellence</title>
    
    <!-- Meta -->
    <meta name="description" content="Advanced Dental Hospital in India with 30 years of clinical excellence. Specialized in Root Canal, Implants, and Braces.">
    <link rel="icon" type="image/jpeg" href="/legacy/ksv-dental-clinic-logo.jpeg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Core Components -->
    <script src="/js/components.js" type="text/babel"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2F2A6B',
                        accent: '#F07D1A',
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        tamil: ['Noto Sans Tamil', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .hero-pattern {
            background-color: #fcfcff;
            background-image: radial-gradient(#2F2A6B 0.5px, #fcfcff 0.5px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] font-inter text-[#1F2937]">
    <div id="root"></div>

    <script type="text/babel">
        // Extremely defensive library detection
        const getLibraries = () => {
            const MotionGlobal = window.Motion || window.FramerMotion || window.framerMotion;
            const motion = MotionGlobal?.motion || (typeof MotionGlobal === 'function' ? MotionGlobal : new Proxy({}, { get: () => (p) => p.children }));
            const AnimatePresence = MotionGlobal?.AnimatePresence || ((p) => p.children);
            const { Navbar, Footer } = window.SharedUI || { Navbar: () => null, Footer: () => null };

            return { motion, AnimatePresence, Navbar, Footer };
        };

        const { motion, AnimatePresence, Navbar, Footer } = getLibraries();

        const Hero = () => (
            <section className="relative min-h-[95vh] flex items-center pt-32 hero-pattern overflow-hidden italic">
                <div className="container mx-auto px-10 grid lg:grid-cols-2 gap-24 items-center">
                    <motion.div 
                        initial={{ opacity: 0, x: -50 }}
                        animate={{ opacity: 1, x: 0 }}
                        transition={{ duration: 0.8, ease: "easeOut" }}
                        className="flex flex-col gap-10"
                    >
                        <div className="flex items-center gap-4">
                            <span className="bg-accent/10 border border-accent/20 text-accent px-6 py-2 rounded-2xl text-xs font-black tracking-[0.2em] uppercase transition-all hover:bg-accent/20">
                                30+ Years Legacy
                            </span>
                            <div className="h-[1px] w-24 bg-gradient-to-r from-accent/30 to-transparent"></div>
                        </div>
                        <h1 className="font-outfit text-7xl lg:text-[100px] font-black text-primary leading-[0.9] tracking-tighter underline decoration-slate-900/5 decoration-8 underline-offset-10">
                            Gentle <br/>
                            <span className="text-accent underline decoration-primary/5 decoration-4">Precision</span>
                        </h1>
                        <p className="font-tamil text-4xl text-primary/80 font-black tracking-tighter italic scale-x-110 origin-left">
                            கே.எஸ்.வி பல் மருத்துவமனை
                        </p>
                        <p className="text-xl text-gray-500 max-w-xl leading-relaxed font-bold uppercase tracking-tighter decoration-accent/10 underline decoration-2 underline-offset-4 decoration-2 italic">
                            Redefining clinical excellence with state-of-the-art digital endodontics and compassionate patient care.
                        </p>
                        <div className="flex flex-wrap gap-8 items-center">
                            <a href="/appointment.html" className="bg-primary text-white p-6 px-12 rounded-[40px] font-black text-2xl shadow-[0_20px_60px_-15px_rgba(47,42,107,0.4)] hover:-translate-y-2 transition-all active:scale-95 italic tracking-tight uppercase tracking-widest tracking-tight">
                                Book Now
                            </a>
                            <a href="/services.html" className="group flex items-center gap-4 text-primary font-black uppercase text-[11px] tracking-[0.3em] transition-all hover:gap-6 italic">
                                Explore Specialties <span className="text-accent font-black text-xl transition-transform group-hover:translate-x-2">&rarr;</span>
                            </a>
                        </div>
                    </motion.div>
                    
                    <motion.div 
                        initial={{ opacity: 0, scale: 0.8 }}
                        animate={{ opacity: 1, scale: 1 }}
                        transition={{ delay: 0.3, duration: 1 }}
                        className="relative hidden lg:block"
                    >
                        <div className="absolute inset-0 bg-blue-100/40 blur-[150px] rounded-full animate-pulse transition-all"></div>
                        <div className="relative z-10 p-4 bg-white/50 backdrop-blur-xl rounded-[80px] border border-white shadow-2xl">
                             <img 
                                src="/legacy/ksv-dental-clinic-logo.jpeg" 
                                className="w-full rounded-[64px] shadow-2xl transition-transform duration-700 hover:rotate-2 hover:scale-[1.02]" 
                                alt="KSV Excellence" 
                            />
                        </div>
                        <div className="absolute -bottom-10 -right-10 bg-white p-10 rounded-[48px] shadow-2xl border border-gray-50 z-20 scale-100 hover:scale-110 transition-transform">
                             <div className="text-5xl font-black text-primary mb-1 tracking-tighter italic">30+</div>
                             <div className="text-[10px] font-black text-gray-400 uppercase tracking-[0.3em]">Specialized Years</div>
                        </div>
                    </motion.div>
                </div>
            </section>
        );

        const App = () => (
            <div>
                <Navbar activePage="home" />
                <Hero />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
