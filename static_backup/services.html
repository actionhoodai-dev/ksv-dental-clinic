<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSV Dental Services | 30 Years Experience</title>
    
    <!-- Meta -->
    <meta name="description" content="Explore advanced dental treatments at KSV Dental Hospital: Root Canal, Implains, Braces, and more.">
    <link rel="icon" type="image/jpeg" href="/legacy/ksv-dental-clinic-logo.jpeg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Core Components -->
    <script src="/js/components.js" type="text/babel"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2F2A6B',
                        accent: '#F07D1A',
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        tamil: ['Noto Sans Tamil', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] font-inter text-[#1F2937]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const getLibraries = () => {
            const MotionGlobal = window.Motion || window.FramerMotion || window.framerMotion;
            const motion = MotionGlobal?.motion || (typeof MotionGlobal === 'function' ? MotionGlobal : new Proxy({}, { get: () => (p) => p.children }));
            const AnimatePresence = MotionGlobal?.AnimatePresence || ((p) => p.children);
            const { Navbar, Footer } = window.SharedUI || { Navbar: () => null, Footer: () => null };

            return { motion, AnimatePresence, Navbar, Footer };
        };

        const { motion, AnimatePresence, Navbar, Footer } = getLibraries();

        const ServicesListing = () => {
            const [activeCategory, setActiveCategory] = useState("Common");
            
            const services = [
                { id: 1, category: "Common", title: "Root Canal", tamil: "ரூட் கெனால்", img: "/legacy/img/services/root-canal.png", desc: "Expert, painless treatment to save your natural tooth.", path: "/services/root-canal.html" },
                { id: 2, category: "Surgical", title: "Tooth Extraction", tamil: "பல் பிடுங்குதல்", img: "/legacy/img/services/impaction.png", desc: "Digital precise extraction for maximum safety.", path: "/services/impaction-tooth-surgery.html" },
                { id: 3, category: "Orthodontics", title: "Braces & Alignment", tamil: "பல் சீரமைப்பு", img: "/legacy/img/services/braces.png", desc: "Corrective treatments for a perfect, healthy smile.", path: "/services/braces-alignment.html" },
                { id: 4, category: "Restorative", title: "Dental Implants", tamil: "பல் இம்ப்ளான்ட்", img: "/legacy/img/services/implants.png", desc: "Premium tooth replacement for a natural look.", path: "/services/dental-implants.html" },
                { id: 5, category: "Restorative", title: "Crown & Bridge", tamil: "பல் கிரீடம்", img: "/legacy/img/services/crowns.png", desc: "High-grade prosthetics for tooth restoration.", path: "/services/crown-bridge.html" },
                { id: 6, category: "Common", title: "Pediatric Care", tamil: "குழந்தைகள் சிகிச்சை", img: "/legacy/img/services/pediatric.png", desc: "Gentle and friendly care for your little ones.", path: "/services/pediatric-dentistry.html" },
            ];

            const categories = ["Common", "Surgical", "Orthodontics", "Restorative"];
            const filtered = services.filter(s => s.category === activeCategory || activeCategory === "Common");

            return (
                <section className="py-32 bg-white min-h-screen relative overflow-hidden italic">
                    <div className="absolute top-0 right-0 w-[800px] h-[800px] bg-blue-50/40 blur-[150px] rounded-full translate-x-1/2 -translate-y-1/2 -z-10 animate-pulse"></div>
                    <div className="container mx-auto px-10 relative z-10">
                        <div className="text-center mb-16">
                            <motion.h1 
                                initial={{ opacity: 0, scale: 0.95 }}
                                whileInView={{ opacity: 1, scale: 1 }}
                                className="font-outfit text-6xl md:text-8xl font-black text-primary mb-8 tracking-tighter underline decoration-slate-900/5 decoration-8 underline-offset-8"
                            >
                                Specialized <br/><span className="text-accent underline decoration-primary/5 decoration-4">Treatments</span>
                            </motion.h1>
                            <p className="text-xl text-gray-400 max-w-2xl mx-auto font-black italic tracking-widest decoration-accent/10 underline decoration-2 underline-offset-4 decoration-2 uppercase mb-4">
                                Painless Surgical Procedures • Digital Diagnostics
                            </p>
                            <p className="font-tamil text-4xl text-primary font-black italic tracking-tighter decoration-slate-900/10 decoration-8 underline-offset-10 origin-center scale-x-110">பல் சிகிச்சை முறைகள்</p>
                        </div>

                        {/* Category Pills */}
                        <div className="sticky top-24 z-40 bg-white/80 backdrop-blur-3xl p-6 rounded-[56px] flex flex-wrap justify-center gap-4 mb-20 shadow-2xl shadow-blue-900/[0.05] border border-blue-50/50 max-w-3xl mx-auto backdrop-saturate-200 italic">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`px-10 py-4 rounded-[28px] font-black transition-all group relative overflow-hidden text-xs uppercase tracking-widest ${activeCategory === cat ? 'bg-primary text-white shadow-[0_15px_40px_-10px_rgba(47,42,107,0.4)] scale-110 active:scale-95' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}
                                >
                                    {cat}
                                    <span className={`absolute bottom-0 left-0 h-1 bg-accent transition-all duration-300 ${activeCategory === cat ? 'w-full' : 'w-0'}`}></span>
                                </button>
                            ))}
                        </div>

                        {/* Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                            <AnimatePresence mode="popLayout">
                                {filtered.map((service) => (
                                    <motion.a
                                        key={service.id}
                                        layout
                                        href={service.path}
                                        initial={{ opacity: 0, scale: 0.9, y: 30 }}
                                        animate={{ opacity: 1, scale: 1, y: 0 }}
                                        exit={{ opacity: 0, scale: 0.9, y: -30 }}
                                        whileHover={{ y: -15 }}
                                        className="group bg-white rounded-[64px] p-3 border border-blue-50/50 shadow-2xl transition-all duration-500 hover:shadow-blue-900/[0.1] active:scale-95"
                                    >
                                        <div className="w-full aspect-[4/3] rounded-[60px] overflow-hidden mb-10 shadow-2xl relative">
                                            <div className="absolute inset-0 bg-primary/20 opacity-0 group-hover:opacity-100 transition-opacity z-10 transition-all duration-700"></div>
                                            <img 
                                                src={service.img} 
                                                onError={(e) => {e.target.src = 'https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=2070&auto=format&fit=crop'}} 
                                                className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000 brightness-[0.8] group-hover:brightness-100" 
                                                alt={service.title} 
                                            />
                                        </div>
                                        <div className="px-10 pb-12">
                                            <h3 className="font-outfit text-4xl font-black text-primary mb-2 transition-colors group-hover:text-accent tracking-tighter decoration-slate-900/5 decoration-4">
                                                {service.title}
                                            </h3>
                                            <p className="font-tamil text-2xl text-accent font-black mb-6 italic tracking-tight origin-left scale-x-110">
                                                {service.tamil}
                                            </p>
                                            <p className="text-gray-400 text-[11px] leading-relaxed mb-10 group-hover:text-gray-600 transition-colors uppercase font-black tracking-[0.2em] decoration-accent/10 underline decoration-2 underline-offset-4 decoration-2">
                                                {service.desc}
                                            </p>
                                            <div className="flex items-center gap-4 text-primary font-black uppercase text-[10px] tracking-[0.3em] italic transition-all group-hover:gap-6">
                                                Start Procedure <span className="text-accent text-xl transition-transform group-hover:translate-x-2">&rarr;</span>
                                            </div>
                                        </div>
                                    </motion.a>
                                ))}
                            </AnimatePresence>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => (
            <div>
                <Navbar activePage="services" />
                <ServicesListing />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
