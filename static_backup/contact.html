<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact KSV Dental Clinic | Dr. L. Suresh</title>
    
    <!-- Meta -->
    <meta name="description" content="Reach KSV Dental Hospital in India. Specialized dental care available Mon–Sat from 6:00 PM to 8:30 PM. Book your appointment today.">
    <link rel="icon" type="image/jpeg" href="/legacy/ksv-dental-clinic-logo.jpeg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/js/components.js" type="text/babel"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2F2A6B',
                        accent: '#F07D1A',
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        tamil: ['Noto Sans Tamil', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] font-inter text-[#1F2937]">
    <div id="root"></div>

    <script type="text/babel">
        const { SharedUI } = window;
        const { Navbar, Footer } = SharedUI;
        const Motion = window.Motion || window.FramerMotion;
        const { motion } = Motion || { motion: (p) => p };

        const Contact = () => (
            <main className="pt-24 min-h-screen">
                <section className="py-24 bg-white relative overflow-hidden">
                    <div className="container mx-auto px-6 grid lg:grid-cols-2 gap-20 relative z-10 transition-all duration-300">
                        <motion.div initial={{ opacity: 0, x: -50 }} whileInView={{ opacity: 1, x: 0 }}>
                            <span className="text-accent underline decoration-accent/10 underline-offset-4 decoration-2 font-black tracking-widest uppercase text-xs mb-4 block italic">Reach Us</span>
                            <h1 className="font-outfit text-6xl lg:text-8xl font-black text-primary leading-tight mb-8 underline decoration-slate-900/10 decoration-8 underline-offset-8">Let's <br/><span className="text-accent underline decoration-primary/5 decoration-4">Connect</span></h1>
                            <p className="text-gray-400 font-bold uppercase tracking-tighter decoration-accent/10 underline decoration-2 underline-offset-4 decoration-2 max-w-xl leading-relaxed mb-12 italic">Visit us for world-class dental care in a comfortable environment. Professional treatments with Dr. Suresh's 30 years of expertise.</p>
                            
                            <div className="space-y-12">
                                <div className="flex gap-10 items-start group">
                                    <div className="w-16 h-16 bg-primary/10 text-primary flex items-center justify-center rounded-[24px] shadow-2xl shadow-primary/10 transform transition-transform group-hover:scale-110">
                                        <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                                    </div>
                                    <div>
                                        <p className="font-black text-gray-700 text-xs uppercase tracking-[0.3em] mb-2 italic">Clinical Location</p>
                                        <p className="font-bold text-primary text-2xl uppercase tracking-widest decoration-slate-900/10 decoration-8 underline-offset-8">KSV Dental Clinic, India</p>
                                    </div>
                                </div>
                                <div className="flex gap-10 items-start group font-bold tracking-tight italic decoration-accent/10 underline decoration-2 underline-offset-4 decoration-2">
                                    <div className="w-16 h-16 bg-accent/10 text-accent flex items-center justify-center rounded-[24px] shadow-2xl shadow-accent/10 transform transition-transform group-hover:scale-110">
                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    </div>
                                    <div>
                                        <p className="font-black text-gray-700 text-xs uppercase tracking-[0.3em] mb-2 italic">Emergency Helpline</p>
                                        <p className="font-black text-[#F07D1A] text-3xl italic tracking-wide">+91 94880 21937</p>
                                    </div>
                                </div>
                                <div className="flex gap-10 items-start group">
                                    <div className="w-16 h-16 bg-blue-100/50 text-blue-900 flex items-center justify-center rounded-[24px] transform transition-transform group-hover:scale-110">
                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </div>
                                    <div>
                                        <p className="font-black text-gray-700 text-xs uppercase tracking-[0.3em] mb-2 italic">Clinical Hours</p>
                                        <p className="font-black text-blue-900 text-2xl italic tracking-widest decoration-accent/10 underline decoration-2 underline-offset-4 decoration-2 italic uppercase">Mon - Sat: 6:00 PM - 8:30 PM</p>
                                    </div>
                                </div>
                            </div>
                        </motion.div>
                        
                        <motion.div initial={{ opacity: 0, scale: 0.95 }} whileInView={{ opacity: 1, scale: 1 }} className="bg-[#F8FAFC] p-12 rounded-[64px] border border-blue-50 shadow-2xl transition-all hover:shadow-blue-900/[0.05]">
                            <h2 className="font-outfit text-4xl font-black text-primary mb-10 tracking-widest uppercase italic tracking-tight italic">Find The Clinic</h2>
                            <div className="w-full h-[400px] bg-gray-200 rounded-[48px] overflow-hidden shadow-inner flex items-center justify-center text-gray-500 font-bold border-[12px] border-white backdrop-blur-3xl italic">
                                [ Interactive Map Interface ]
                            </div>
                        </motion.div>
                    </div>
                </section>
            </main>
        );

        const App = () => (
            <div>
                <Navbar activePage="contact" />
                <Contact />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
