<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | KSV Dental Clinic | Dr. L. Suresh</title>
    <meta name="description" content="View our clinic, advanced dental equipment, and successful dental procedure results at KSV Dental Clinic.">
    <link rel="icon" type="image/jpeg" href="ksv-dental-clinic-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="navbar" class="navbar">
        <div class="container navbar__inner">
            <a href="index.html" class="logo">
                <img src="ksv-dental-clinic-logo.jpeg" alt="KSV Logo" class="logo__img">
                <div class="logo__text">
                    <span class="logo__name">KSV</span>
                    <span class="logo__sub">Dental Clinic</span>
                </div>
            </a>
            <nav class="nav" id="main-nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Home</a></li>
                    <li><a href="about.html" class="nav__link">About</a></li>
                    <li><a href="services.html" class="nav__link">Services</a></li>
                    <li><a href="gallery.html" class="nav__link nav__link--active">Gallery</a></li>
                </ul>
                <a href="appointment.html" class="btn btn--primary nav__cta">Book Appointment</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <div class="page-hero__breadcrumb"><a href="index.html">Home</a><span>/</span><span>Gallery</span></div>
                <h1 class="page-hero__title animate-in">கேலரி<br><span style="font-size:var(--text-xl);font-weight:500;color:var(--text-secondary)">Our Clinical Gallery</span></h1>
                <p class="page-hero__sub">Explore KSV Dental Clinic's modern treatment rooms and clinical facilities.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--s-8);">
                    <div style="border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm);"><img src="ksv-dental-clinic-logo.jpeg" alt="Clinic Interior" style="width:100%; height:300px; object-fit:cover;"></div>
                    <div style="border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm);"><img src="img/services/root-canal.png" alt="Root Canal" style="width:100%; height:300px; object-fit:cover;"></div>
                    <div style="border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm);"><img src="img/services/implants.png" alt="Dental Implants" style="width:100%; height:300px; object-fit:cover;"></div>
                    <div style="border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm);"><img src="img/services/braces.png" alt="Braces" style="width:100%; height:300px; object-fit:cover;"></div>
                    <div style="border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm);"><img src="img/services/pediatric.png" alt="Pediatric" style="width:100%; height:300px; object-fit:cover;"></div>
                    <div style="border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-sm);"><img src="img/services/impaction.png" alt="Impaction" style="width:100%; height:300px; object-fit:cover;"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
            <a href="index.html" class="logo"><img src="ksv-dental-clinic-logo.jpeg" alt="KSV Logo" class="logo__img"></a>
            <p>&copy; 2026 KSV Dental Clinic | Developed by <strong>Actionhood AI</strong></p>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
</body>
</html>
