<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | KSV Dental Clinic | Dr. L. Suresh</title>
    <meta name="description" content="Schedule your visit to KSV Dental Clinic for premium dental care.">
    <link rel="icon" type="image/jpeg" href="ksv-dental-clinic-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="navbar" class="navbar">
        <div class="container navbar__inner">
            <a href="index.html" class="logo">
                <img src="ksv-dental-clinic-logo.jpeg" alt="KSV Logo" class="logo__img">
                <div class="logo__text">
                    <span class="logo__name">KSV</span>
                    <span class="logo__sub">Dental Clinic</span>
                </div>
            </a>
            <nav class="nav" id="main-nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Home</a></li>
                    <li><a href="about.html" class="nav__link">About</a></li>
                    <li><a href="services.html" class="nav__link">Services</a></li>
                    <li><a href="gallery.html" class="nav__link">Gallery</a></li>
                </ul>
                <a href="appointment.html" class="btn btn--primary nav__cta">Book Appointment</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <div class="page-hero__breadcrumb"><a href="index.html">Home</a><span>/</span><span>Appointment</span></div>
                <h1 class="page-hero__title animate-in">முன்பதிவு செய்ய<br><span style="font-size:var(--text-xl);font-weight:500;color:var(--text-secondary)">Book Your Appointment</span></h1>
                <p class="page-hero__sub">Schedule your consultation with Dr. L. Suresh at KSV Dental Clinic.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div style="max-width: 600px; margin: 0 auto; background: white; padding: var(--s-10); border-radius: var(--r-2xl); box-shadow: var(--shadow-lg);">
                    <form id="appointment-form" class="appointment-form">
                        <div style="display:flex; flex-direction:column; gap:var(--s-5);">
                            <div>
                                <label for="name" style="font-weight:600; margin-bottom:var(--s-2); display:block;">Full Name</label>
                                <input type="text" id="name" name="name" required style="width:100%; padding:var(--s-3); border:1px solid #ddd; border-radius:var(--r-md);">
                            </div>
                            <div>
                                <label for="phone" style="font-weight:600; margin-bottom:var(--s-2); display:block;">Phone Number</label>
                                <input type="tel" id="phone" name="phone" required style="width:100%; padding:var(--s-3); border:1px solid #ddd; border-radius:var(--r-md);">
                            </div>
                            <div>
                                <button type="submit" class="btn btn--primary" style="width:100%; padding:var(--s-4);">Submit Request</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer__grid">
                <div class="footer__brand-col">
                    <a href="index.html" class="logo">
                        <img src="ksv-dental-clinic-logo.jpeg" alt="KSV Logo" class="logo__img">
                    </a>
                </div>
                <div>
                  <h4 class="footer__heading">Contact</h4>
                  <p class="footer__text">Mon-Sat: 6:00 PM - 8:30 PM</p>
                </div>
            </div>
            <div class="footer__bottom">
                <p>&copy; 2026 KSV Dental Clinic | Developed by <strong>Actionhood AI</strong></p>
            </div>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
</body>
</html>
